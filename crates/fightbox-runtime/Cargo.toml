[package]
name = "fightbox-runtime"
version = "0.1.0"
description = "Fightbox runtime capability and status facade"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/mduncs/spatial-audio-engine"

[features]
default = []
live-output = ["dep:cpal"]

[dependencies]
fightbox-api = { path = "../fightbox-api" }
cpal = { version = "0.16", optional = true }

[lib]
path = "src/lib.rs"
