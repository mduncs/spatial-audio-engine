language = "C"
include_guard = "FIGHTBOX_H"
pragma_once = true
documentation = true
usize_is_size_t = true
style = "both"
cpp_compat = true
autogen_warning = "/* Generated by cbindgen from fightbox-ffi. Do not edit by hand. */"

[parse]
parse_deps = false

[export]
include = [
    "FbResult",
    "FbQualityTier",
    "FbVec3",
    "FbPose",
    "FbSessionConfig",
    "FbSourceUpdate",
    "FbSession",
    "fb_session_create",
    "fb_session_update_listener",
    "fb_session_update_source",
    "fb_session_render_block",
    "fb_session_telemetry_json",
    "fb_session_destroy",
]
opaque = ["FbSession"]

[fn]
must_use = "FB_MUST_USE"

[defines]
"target_os = ios" = "TARGET_OS_IPHONE"
