language = "C"
include_guard = "FIGHTBOX_H"
pragma_once = true
documentation = true
usize_is_size_t = true
style = "both"
cpp_compat = true
autogen_warning = "/* Generated by cbindgen from fightbox-ffi. Do not edit by hand. */"
header = """/* Regenerate from the repository root with cbindgen 0.29.2:
 * cbindgen --config crates/fightbox-ffi/cbindgen.toml \\
 *   --crate fightbox-ffi --output crates/fightbox-ffi/include/fightbox.h
 */"""
after_includes = """/* Frozen V1 source type: preserve the originally published C typedef even
 * though Rust carries an explicit u32 representation internally. */
typedef enum FbQualityTier {
  FbQualityDesktop = 0,
  FbQualityMobile = 1,
} FbQualityTier;"""

[parse]
parse_deps = false

